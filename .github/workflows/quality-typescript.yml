name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - client/**
      - migrations/**
      - public/**
      - scripts/**
      - src/**
      - tests/**
      - tools/**
      - .github/workflows/**
      - biome.json
      - drizzle.config.ts
      - package.json
      - playwright.config.ts
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - vitest.config.ts
      - worker-configuration.d.ts
      - wrangler*.jsonc

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Backend policy tests
        run: pnpm test:backend
      - name: Client production build
        run: pnpm client:build
      - name: Angular unit tests
        run: pnpm --dir client exec ng test --watch=false --no-progress

  browser:
    name: Browser
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: pnpm test:browser
