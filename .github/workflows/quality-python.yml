name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - containers/driving-analysis/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  python:
    name: Python media service
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: containers/driving-analysis
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFmpeg test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Run Python quality gate
        run: uv run --frozen python -m driving_analysis_service.quality
      - name: Build production-runtime test image
        run: docker build --target test --tag rc-mech-driving-analysis:test .
      - name: Run real fixtures in production runtime
        run: docker run --rm rc-mech-driving-analysis:test
