[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "rc-mech-driving-analysis"
version = "0.1.0"
description = "Internal Race-video media validation service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
sam31 = [
  "sam3 @ git+https://github.com/facebookresearch/sam3.git@96914d2425f90a64f45ca977c2b5165418099543",
  "setuptools==81.0.0",
  "torch==2.10.0",
  "torchvision==0.25.0",
]

[project.scripts]
subject-benchmark = "driving_analysis_service.subject_benchmark_cli:main"

[dependency-groups]
dev = [
  "httpx2==2.10.0",
  "mypy==1.19.1",
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "ruff==0.15.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/driving_analysis_service"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=driving_analysis_service",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=100",
]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["src/driving_analysis_service/quality.py"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "SLF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
