<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chassis Notes — Setup history for RC racers</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Keep your RC car’s current setup, intentional changes, Drive sessions, trackside voice notes, and maintenance history together in one private field notebook.">
  <script>
    (() => {
      try {
        const preference = localStorage.getItem('rc-mech.appearance');
        if (preference === 'light' || preference === 'dark') {
          document.documentElement.dataset.appearancePreference = preference;
          document.documentElement.dataset.appearance = preference;
        }
      } catch {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
