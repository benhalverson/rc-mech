<div class="route-announcement" aria-live="polite" aria-atomic="true">
	{{ transition.announcement() }}
</div>
@if (transition.loading() && !transition.checkingWorkspace()) {
	<div class="route-state" aria-hidden="true">Loading page…</div>
}
@if (transition.error()) {
	<div class="route-state alloy-error-state" role="alert">
		<p>{{ transition.error() }}</p>
		<button class="alloy-control alloy-control-secondary" type="button" (click)="transition.retry()">Try again</button>
	</div>
}
@if (transition.checkingWorkspace()) {
	<main class="access-shell" aria-live="polite">
		<div class="alloy-section-heading">Chassis Notes / Field notebook</div>
		<p class="checking">Checking the garage latch…</p>
	</main>
} @else {
	<router-outlet />
}
