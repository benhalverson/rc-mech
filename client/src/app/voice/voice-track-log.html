@if (carStore.loading()) {
	<div class="alloy-state" role="status">Opening the car record…</div>
} @else if (carStore.failure(); as failure) {
	<div class="alloy-state alloy-error-state" role="alert">
		<p class="m-0">{{ failure.message }}</p>
		@if (failure.retryable) {
			<button class="alloy-control alloy-control-secondary mt-3" type="button" (click)="carStore.retry()">Try again</button>
		}
	</div>
} @else if (carStore.car(); as car) {
	<app-car-section-shell [car]="car" section="voice">
		<app-voice-note-workspace [carId]="car.id" [archived]="!!car.archivedAt" [showHistory]="true" />
	</app-car-section-shell>
}
