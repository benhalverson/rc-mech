<svg class="track-canvas block h-full w-full" viewBox="0 0 640 360" [attr.preserveAspectRatio]="overlay() ? 'none' : 'xMidYMid meet'" [attr.role]="decorative() ? null : 'img'" [attr.aria-hidden]="decorative() ? 'true' : null" [attr.aria-label]="decorative() ? null : label()">
	<title>{{ label() }}</title>
	@if (!overlay()) {
		<rect class="fill-alloy-command-control" width="640" height="360" />
		<path class="stroke-alloy-command-separator" d="M160 0V360M320 0V360M480 0V360M0 90H640M0 180H640M0 270H640" fill="none" stroke-width="1" opacity=".6" />
	}
	@for (corner of corners(); track $index) {
		<line class="stroke-alloy-command-accent" [attr.x1]="svgX(corner.entryGate.start)" [attr.y1]="svgY(corner.entryGate.start)" [attr.x2]="svgX(corner.entryGate.end)" [attr.y2]="svgY(corner.entryGate.end)" stroke-width="4" />
		<line class="stroke-alloy-command-secondary" [attr.x1]="svgX(corner.exitGate.start)" [attr.y1]="svgY(corner.exitGate.start)" [attr.x2]="svgX(corner.exitGate.end)" [attr.y2]="svgY(corner.exitGate.end)" stroke-width="4" stroke-dasharray="8 5" />
		<rect class="stroke-alloy-command-text" [attr.x]="corner.cornerView.x * 640" [attr.y]="corner.cornerView.y * 360" [attr.width]="corner.cornerView.width * 640" [attr.height]="corner.cornerView.height * 360" fill="none" stroke-dasharray="4 4" />
		<text class="fill-alloy-command-text" [attr.x]="corner.cornerView.x * 640 + 6" [attr.y]="corner.cornerView.y * 360 + 18" font-size="13">{{ corner.order }} · {{ corner.name }}</text>
	}
	@if (activeCorner(); as active) {
		<circle class="fill-alloy-command-text stroke-alloy-command-accent" [attr.cx]="svgX(active.entryGate.start)" [attr.cy]="svgY(active.entryGate.start)" r="7" stroke-width="3" />
		<circle class="fill-alloy-command-text stroke-alloy-command-accent" [attr.cx]="svgX(active.entryGate.end)" [attr.cy]="svgY(active.entryGate.end)" r="7" stroke-width="3" />
		<circle class="fill-alloy-command-text stroke-alloy-command-accent" [attr.cx]="svgX(active.exitGate.start)" [attr.cy]="svgY(active.exitGate.start)" r="7" stroke-width="3" />
		<circle class="fill-alloy-command-text stroke-alloy-command-accent" [attr.cx]="svgX(active.exitGate.end)" [attr.cy]="svgY(active.exitGate.end)" r="7" stroke-width="3" />
	}
</svg>
